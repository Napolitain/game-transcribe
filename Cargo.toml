[package]
name = "game-transcribe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight, offline voice-to-game-chat client for Windows"
license = "MIT"
homepage = "https://github.com/Napolitain/game-transcribe"
repository = "https://github.com/Napolitain/game-transcribe"

[dependencies]
anyhow = "1.0"
cpal = "0.18.2"
crossbeam-channel = "0.5"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
whisper-rs = "0.16.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
